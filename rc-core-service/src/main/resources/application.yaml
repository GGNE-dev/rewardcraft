spring:
  application:
    name: rc-core-service

  profiles:
    active: local

  threads:
    virtual:
      enabled: true

  # ── DataSource ───────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/rc_core
    username: rc_user
    password: rc_pass
    driver-class-name: org.postgresql.Driver

  # ── JPA ──────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true  # Hibernate 스키마 생성 후 data.sql 실행
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ── Security / OAuth2 ────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # ── Redis ─────────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: rewardcraft-main
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "org.ggne.rc.*"
    listener:
      ack-mode: manual

  # ── Feign + CircuitBreaker ────────────────────────────────────────────────
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000   # TCP 연결 타임아웃 2초 — 미설정 시 hang 상태로 스레드 무한 점유
            read-timeout: 3000      # 응답 읽기 타임아웃 3초

# ── JWT ───────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 900
  refresh-token-validity: 1209600

# ── 앱 커스텀 설정 ────────────────────────────────────────────────────────
app:
  oauth2:
    redirect-uri: http://localhost:3000/auth/callback

# ── Kafka 토픽명 ──────────────────────────────────────────────────────────
kafka:
  topics:
    mission-completed: mission.completed

# ── 외부 서비스 URL ───────────────────────────────────────────────────────
services:
  challenge:
    url: http://localhost:8082

# ── CircuitBreaker (Resilience4j) ─────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      challenge-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      challenge-service:
        timeout-duration: 3s
