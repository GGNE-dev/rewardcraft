spring:
  application:
    name: challenge-service

  threads:
    virtual:
      enabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: false   # LocalDateTime을 ISO 문자열로 직렬화
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:postgresql://localhost:5433/rc_challenge
    username: rc_user
    password: rc_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true  # Hibernate 스키마 생성 후 data.sql 실행
    show-sql: false  # System.out 직접 출력 방지 — SLF4J 경유를 위해 false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always  # PostgreSQL은 embedded DB가 아니라 기본값이 never이므로 명시 필요

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: challenge-main
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "org.ggne.rc.events"
    listener:
      ack-mode: manual

server:
  port: 8082

logging:
  level:
    org.ggne.challenge: DEBUG
    org.hibernate.SQL: DEBUG  # show-sql 대신 SLF4J 경유 — TurboFilter가 outbox_events 쿼리 차단 가능

kafka:
  topics:
    mission-completed: mission.completed
