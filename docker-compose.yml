services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # Ch 00-1~ : 메인 데이터베이스
  postgres:
    image: postgres:16-alpine          # alpine: 경량 리눅스 베이스 이미지 (용량 최소화)
    container_name: rc-postgres        # 컨테이너 이름 고정 (docker logs rc-postgres 등에서 사용)
    ports:
      - "5433:5432"                    # 호스트:컨테이너 포트 포워딩. 로컬 5432(PostgreSQL 기본 포트)가 이미 사용 중이므로 5433 사용
    environment:
      POSTGRES_DB: rewardcraft         # 자동 생성할 데이터베이스 이름
      POSTGRES_USER: rc_user           # 슈퍼유저 계정 (application.yaml의 datasource.username과 일치해야 함)
      POSTGRES_PASSWORD: rc_pass       # 비밀번호 (application.yaml의 datasource.password와 일치해야 함)
    volumes:
      - postgres_data:/var/lib/postgresql/data  # 컨테이너 재시작 후에도 데이터 유지 (named volume)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rc_user -d rewardcraft" ]  # DB가 실제로 연결 가능한지 확인
      interval: 10s   # 10초마다 체크
      timeout: 5s     # 5초 안에 응답 없으면 실패로 간주
      retries: 5      # 5번 연속 실패 시 unhealthy 상태로 전환

  # ── Redis ────────────────────────────────────────────────────────────────
  # Ch 03~: Refresh Token 저장, Rate Limiting, 분산 락, Sorted Set 랭킹
  redis:
    image: redis:7-alpine              # alpine: 경량 이미지
    container_name: rc-redis
    ports:
      - "6379:6379"                    # Redis 기본 포트
    volumes:
      - redis_data:/data               # AOF/RDB 영속화 데이터 보존
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ────────────────────────────────────────────────────────────────
  # Ch 05~: 미션 완료 이벤트 비동기 처리 (KRaft 모드 — Zookeeper 불필요)
  kafka:
    image: apache/kafka:3.9.0
    container_name: rc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 0.0.0.0 대신 빈 호스트(:포트)로 지정 — 모든 인터페이스 수신이지만 advertised.listeners 검증 통과
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 단일 노드 combined 모드: 브로커와 컨트롤러가 같은 프로세스에서 동작
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_REST_PORT: 19080   # 기본값 8080이 Spring Boot와 충돌 → 19080으로 변경
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:    # 도커가 관리하는 named volume. 컨테이너 삭제 후 재생성해도 데이터 보존
  redis_data:       # Redis 데이터 영속화
  kafka_data:       # Kafka 로그 및 메타데이터 영속화
